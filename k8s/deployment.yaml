apiVersion: apps/v1

kind: Deployment

metadata:
  name: devsecops-platform
  labels:
    app: devsecops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devsecops-platform

  template:
    metadata:
      labels:
        app: devsecops-platform

    spec:
      containers:
        - name: devsecops-platform
          image: devsecops-platform:1.3
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"